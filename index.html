<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>buzinaivvvan To-Do 🎃</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
min-height:100vh;
color:#fff;
background:
radial-gradient(circle at 20% 10%,#ff8c00 0,transparent 25%),
radial-gradient(circle at 80% 20%,#6b21a8 0,transparent 30%),
linear-gradient(135deg,#120b1a,#26112f,#0d1117);
}

.app{
width:min(720px,92%);
margin:0 auto;
padding:55px 0;
}

.hero{text-align:center;margin-bottom:25px}

.emoji{
font-size:55px;
animation:float 2s infinite ease-in-out;
}

h1{
font-size:clamp(34px,8vw,52px);
margin:5px 0;
text-shadow:0 0 20px #ff7b00;
}

.subtitle{
color:#d8c7e8;
margin-bottom:25px;
}

.card{
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.2);
border-radius:24px;
padding:20px;
backdrop-filter:blur(15px);
box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.input-row{
display:flex;
gap:10px;
margin-bottom:18px;
}

input{
flex:1;
padding:15px;
border:0;
border-radius:14px;
font-size:16px;
outline:none;
background:#fff;
color:#222;
}

button{
border:0;
border-radius:14px;
padding:13px 18px;
font-weight:700;
cursor:pointer;
font-size:15px;
}

.add{
background:#ff7b00;
color:#fff;
box-shadow:0 0 18px rgba(255,123,0,.5);
}

.filters{
display:flex;
gap:8px;
margin-bottom:15px;
flex-wrap:wrap;
}

.filter{
background:rgba(255,255,255,.1);
color:#fff;
}

.filter.active{
background:#6d28d9;
}

ul{
list-style:none;
padding:0;
margin:0;
}

li{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin:10px 0;
background:rgba(0,0,0,.25);
border-radius:16px;
border:1px solid rgba(255,255,255,.1);
}

li.done .text{
text-decoration:line-through;
opacity:.5;
}

.check{
width:24px;
height:24px;
border-radius:50%;
border:2px solid #ff8c00;
padding:0;
background:transparent;
flex-shrink:0;
}

.done .check{
background:#ff8c00;
}

.text{
flex:1;
word-break:break-word;
}

.delete{
background:transparent;
color:#ff7777;
font-size:20px;
padding:5px 8px;
}

.bottom{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:18px;
color:#cbbbd8;
font-size:14px;
}

.clear{
background:transparent;
color:#ff9b9b;
}

.empty{
text-align:center;
padding:30px;
color:#cbbbd8;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

@media(max-width:500px){
.input-row{flex-direction:column}
.add{width:100%}
}
</style>
</head>

<body>

<div class="app">

<div class="hero">
<div class="emoji">🎃</div>
<h1>buzinaivvvan To-Do</h1>
<div class="subtitle">🍂 Осеннее Halloween-обновление 👻</div>
</div>

<div class="card">

<div class="input-row">
<input id="input" placeholder="Напиши новую задачу...">
<button class="add" onclick="addTask()">🎃 Добавить</button>
</div>

<div class="filters">
<button class="filter active" onclick="setFilter('all',this)">Все</button>
<button class="filter" onclick="setFilter('active',this)">Активные</button>
<button class="filter" onclick="setFilter('done',this)">Выполненные</button>
</div>

<ul id="list"></ul>

<div class="bottom">
<span id="count"></span>
<button class="clear" onclick="clearDone()">Удалить выполненные</button>
</div>

</div>
</div>

<script>
let tasks=JSON.parse(localStorage.getItem("buzinaivvvanTasks")||"[]");
let filter="all";

const input=document.getElementById("input");
const list=document.getElementById("list");
const count=document.getElementById("count");

input.addEventListener("keydown",e=>{
if(e.key==="Enter") addTask();
});

function save(){
localStorage.setItem("buzinaivvvanTasks",JSON.stringify(tasks));
}

function addTask(){
const text=input.value.trim();
if(!text)return;

tasks.push({
text:text,
done:false
});

input.value="";
save();
render();
}

function toggleTask(i){
tasks[i].done=!tasks[i].done;
save();
render();
}

function deleteTask(i){
tasks.splice(i,1);
save();
render();
}

function clearDone(){
tasks=tasks.filter(t=>!t.done);
save();
render();
}

function setFilter(f,button){
filter=f;

document.querySelectorAll(".filter")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");
render();
}

function render(){

list.innerHTML="";

let visible=tasks.filter(t=>{
if(filter==="active")return !t.done;
if(filter==="done")return t.done;
return true;
});

if(visible.length===0){
list.innerHTML='<div class="empty">👻 Здесь пока пусто...<br>Добавь первую задачу 🎃</div>';
}

visible.forEach(t=>{
const i=tasks.indexOf(t);

const li=document.createElement("li");

if(t.done)li.classList.add("done");

li.innerHTML=`
<button class="check" onclick="toggleTask(${i})">
${t.done?"✓":""}
</button>

<span class="text">${escapeHtml(t.text)}</span>

<button class="delete" onclick="deleteTask(${i})">🗑️</button>
`;

list.appendChild(li);
});

const active=tasks.filter(t=>!t.done).length;

count.textContent=`Осталось задач: ${active}`;
}

function escapeHtml(text){
return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

render();
</script>

</body>
</html>
